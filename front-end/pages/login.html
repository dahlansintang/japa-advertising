<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk & Daftar - PT Japa Prabu</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body { margin: 0; font-family: sans-serif; background-color: #f4f4f4; }
        .header-login { background-color: #003366; color: white; padding: 20px; text-align: center; }
        .login-container {
            max-width: 420px;
            margin: 40px auto;
            padding: 30px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        /* Tab Navigasi */
        .auth-tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 2px solid #e2e8f0;
        }
        .auth-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: bold;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s;
        }
        .auth-tab.active {
            color: #003366;
            border-bottom: 3px solid #ff9900;
            margin-bottom: -2px;
        }
        .form-section { display: none; }
        .form-section.active { display: block; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #333; }
        .form-group input, .form-group textarea { 
            width: 100%; padding: 10px; border: 1px solid #ccc; 
            border-radius: 4px; box-sizing: border-box; font-size: 14px;
            font-family: inherit;
        }
        .form-group textarea { resize: vertical; min-height: 70px; }
        .btn-auth {
            width: 100%; padding: 12px; background-color: #ff9900;
            color: white; border: none; border-radius: 4px;
            font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
        .btn-auth:hover { background-color: #e68a00; }
        .alert-msg { padding: 10px; border-radius: 4px; text-align: center; margin-bottom: 15px; font-size: 13px; display: none; }
        .alert-error { background-color: #f8d7da; color: #721c24; }
        .alert-success { background-color: #d4edda; color: #155724; }
        .extra-links {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-size: 13px;
        }
        .extra-links a { color: #003366; text-decoration: none; }
        .extra-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <header class="header-login">
        <h1 style="margin: 0;">PT Japa Prabu Advertising</h1>
        <p style="margin: 5px 0 15px 0; font-size: 14px;">Sistem Manajemen & Portal Pelanggan</p>
        <a href="/" style="color: #ff9900; text-decoration: underline; font-size: 14px; font-weight: bold;">&larr; Kembali ke Halaman Utama</a>
    </header>

    <main>
        <div class="login-container">
            <!-- Pilihan Tab (Masuk / Daftar) -->
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login')">Masuk</button>
                <button class="auth-tab" onclick="switchTab('register')">Daftar Pelanggan</button>
            </div>

            <!-- Pesan Alert Global -->
            <div id="alert-message" class="alert-msg"></div>

            <!-- FORM LOGIN -->
            <div id="section-login" class="form-section active">
                <form id="loginForm">
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" required placeholder="contoh: email@domain.com">
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" required placeholder="Masukkan password">
                    </div>
                    <button type="submit" class="btn-auth">Masuk</button>
                    <div class="extra-links">
                        <a href="#" onclick="alert('Fitur pemulihan password silakan hubungi admin via WhatsApp/Email.')">Lupa Password?</a>
                    </div>
                </form>
            </div>

            <!-- FORM PENDAFTARAN PELANGGAN -->
            <div id="section-register" class="form-section">
                <form id="registerForm">
                    <div class="form-group">
                        <label for="reg-nama">Nama Lengkap</label>
                        <input type="text" id="reg-nama" required placeholder="Nama lengkap Anda">
                    </div>
                    <div class="form-group">
                        <label for="reg-email">Email</label>
                        <input type="email" id="reg-email" required placeholder="email@domain.com">
                    </div>
                    <div class="form-group">
                        <label for="reg-telp">Nomor Telepon / WhatsApp</label>
                        <input type="text" id="reg-telp" placeholder="08xxxxxxxxxx">
                    </div>
                    <div class="form-group">
                        <label for="reg-alamat">Alamat Lengkap</label>
                        <textarea id="reg-alamat" placeholder="Masukkan alamat pengiriman lengkap..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="reg-password">Password</label>
                        <input type="password" id="reg-password" required placeholder="Buat password baru">
                    </div>
                    <button type="submit" class="btn-auth" style="background-color: #003366;">Daftar Akun</button>
                </form>
            </div>
        </div>
    </main>

    <script>
        // Fungsi untuk beralih antar tab Masuk dan Daftar
        function switchTab(tabName) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
            
            const alertBox = document.getElementById('alert-message');
            alertBox.style.display = 'none';

            if (tabName === 'login') {
                document.querySelectorAll('.auth-tab')[0].classList.add('active');
                document.getElementById('section-login').classList.add('active');
            } else {
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
                document.getElementById('section-register').classList.add('active');
            }
        }

        // Tangani Proses Login
        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const alertBox = document.getElementById('alert-message');

            alertBox.style.display = 'none';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                    credentials: 'include'
                });

                const result = await response.json();

                if (response.ok && result.status === 'success') {
                    const role = result.role ? String(result.role).toLowerCase().trim() : '';
                    if (role === 'admin') {
                        window.location.href = '/pages/admin.html';
                    } else {
                        window.location.href = '/pages/customer.html';
                    }
                } else {
                    alertBox.className = 'alert-msg alert-error';
                    alertBox.innerText = result.message || 'Login gagal.';
                    alertBox.style.display = 'block';
                }
            } catch (error) {
                console.error('Error:', error);
                alertBox.className = 'alert-msg alert-error';
                alertBox.innerText = 'Terjadi kesalahan jaringan.';
                alertBox.style.display = 'block';
            }
        });

        // Tangani Proses Pendaftaran Pelanggan
        document.getElementById('registerForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const nama_lengkap = document.getElementById('reg-nama').value;
            const email = document.getElementById('reg-email').value;
            const no_telp = document.getElementById('reg-telp').value;
            const alamat = document.getElementById('reg-alamat').value;
            const password = document.getElementById('reg-password').value;
            const alertBox = document.getElementById('alert-message');

            alertBox.style.display = 'none';

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nama_lengkap, email, no_telp, alamat, password })
                });

                const result = await response.json();

                if (response.ok && result.status === 'success') {
                    alertBox.className = 'alert-msg alert-success';
                    alertBox.innerText = 'Pendaftaran berhasil! Silakan masuk menggunakan akun Anda.';
                    alertBox.style.display = 'block';
                    document.getElementById('registerForm').reset();
                    setTimeout(() => switchTab('login'), 2000);
                } else {
                    alertBox.className = 'alert-msg alert-error';
                    alertBox.innerText = result.message || 'Pendaftaran gagal.';
                    alertBox.style.display = 'block';
                }
            } catch (error) {
                console.error('Error:', error);
                alertBox.className = 'alert-msg alert-error';
                alertBox.innerText = 'Terjadi kesalahan jaringan.';
                alertBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
