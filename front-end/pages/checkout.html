
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Pesanan - PT Japa Prabu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #f8fafc;
            color: #1e293b;
        }

        navbar {
            display: block;
            background: #fff;
            border-bottom: 1px solid #e2e8f0;
            padding: 16px 24px;
            box-shadow: 0 1px 3px rgba(0,0,0,.05);
        }

        .nav-container {
            max-width: 1200px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 1px 3px rgba(0,0,0,.05);
            border: 1px solid #e2e8f0;
            margin-bottom: 20px;
        }

        h2 {
            margin-bottom: 20px;
            color: #0f172a;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 10px;
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            background: #fff;
        }

        input:read-only {
            background: #f1f5f9;
            cursor: not-allowed;
        }

        .summary-box {
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            border: 1px solid #e2e8f0;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px dashed #cbd5e1;
            font-weight: 700;
            font-size: 18px;
            color: #2563eb;
        }

        .btn-submit {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin-top: 20px;
        }

        .btn-submit:hover {
            background: #1d4ed8;
        }

        .btn-submit:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .btn-back {
            background: #e2e8f0;
            color: #475569;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 20px;
            display: inline-block;
            text-decoration: none;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid #f1f5f9;
            font-size: 14px;
        }

        .cart-item-info {
            min-width: 0;
        }

        .cart-item-info strong {
            color: #0f172a;
        }

        .cart-item-info small {
            display: block;
            margin-top: 5px;
            color: #64748b;
            line-height: 1.5;
        }

        .cart-item-price {
            color: #2563eb;
            font-weight: 600;
            white-space: nowrap;
        }

        @media(max-width: 600px) {
            main {
                margin: 20px auto;
                padding: 0 12px;
            }

            .card {
                padding: 18px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .summary-total {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

<navbar>
    <div class="nav-container">
        <a href="/pages/customer.html" class="brand">
            <img src="/images/logo.png" alt="Logo" width="30"
                 onerror="this.style.display='none'">
            Checkout Japa Prabu
        </a>
    </div>
</navbar>

<main>

    <a href="/pages/customer.html" class="btn-back">
        ← Kembali ke Katalog
    </a>

    <form id="checkoutForm">

        <!-- RINCIAN PRODUK -->
        <div class="card" id="cardRincianProduk">

            <h2 id="sectionTitle">Rincian Produk</h2>

            <div id="cart-items-summary-container"
                 style="margin-bottom:16px;"></div>

            <div class="form-group" id="groupNamaProduk">
                <label>Nama Produk</label>
                <input type="text" id="nama_produk" readonly>
            </div>

            <div class="form-row" id="rowSatuanQty">

                <div class="form-group">
                    <label>Harga Satuan / Estimasi</label>
                    <input type="text" id="harga_satuan_display" readonly>
                </div>

                <div class="form-group">
                    <label>Jumlah Pesanan (Qty)</label>
                    <input type="number" id="jumlah"
                           min="1" value="1" required>
                </div>

            </div>

            <div class="form-group" id="groupDetailCatatan">
                <label>Detail Ukuran & Catatan Desain</label>
                <textarea id="detail_ukuran" rows="2"
                    placeholder="Contoh: Ukuran 3x1 Meter, finishing mata ayam..."
                    required></textarea>
            </div>

        </div>

        <!-- ALAMAT DAN PEMBAYARAN -->
        <div class="card">

            <h2>Alamat Pengiriman & Pembayaran</h2>

            <div class="form-row">

                <div class="form-group">
                    <label>Provinsi</label>
                    <select id="provinsi" required>
                        <option value="">Pilih Provinsi</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Kabupaten / Kota</label>
                    <select id="kabupaten" required>
                        <option value="">Pilih Provinsi Terlebih Dahulu</option>
                    </select>
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label>Kecamatan</label>
                    <select id="kecamatan" required>
                        <option value="">Pilih Kabupaten Terlebih Dahulu</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Kelurahan / Desa</label>
                    <select id="kelurahan" required>
                        <option value="">Pilih Kecamatan Terlebih Dahulu</option>
                    </select>
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label>Kode Pos</label>
                    <input type="text" id="kode_pos"
                           placeholder="Contoh: 78611" required>
                </div>

                <div class="form-group">
                    <label>Pilih Kurir / Layanan Pengiriman</label>
                    <select id="layanan_kurir" required>
                        <option value="">Pilih Kabupaten/Kota Terlebih Dahulu</option>
                    </select>
                </div>

            </div>

            <div class="form-group">
                <label>Detail Alamat</label>
                <textarea id="detail_alamat" rows="2"
                    placeholder="Nama jalan, nomor rumah, RT/RW, patokan..."
                    required></textarea>
            </div>

            <div class="form-group">
                <label>Metode Pembayaran</label>

                <select id="metode_pembayaran" required>
                    <option value="Transfer Bank BCA">
                        Transfer Bank BCA
                    </option>

                    <option value="Transfer Bank Mandiri">
                        Transfer Bank Mandiri
                    </option>

                    <option value="E-Wallet (GoPay / OVO / Dana)">
                        E-Wallet (GoPay / OVO / Dana)
                    </option>

                    <option value="Bayar di Toko (Tunai)">
                        Bayar di Toko (Tunai)
                    </option>
                </select>
            </div>

        </div>

        <!-- RINGKASAN BIAYA -->
        <div class="card">

            <h2>Ringkasan Biaya</h2>

            <div class="summary-box">

                <div class="summary-row">
                    <span>Subtotal Produk</span>
                    <span id="subtotal_display">Rp 0</span>
                </div>

                <div class="summary-row">
                    <span>Ongkos Kirim</span>
                    <span id="ongkir_display">Rp 0</span>
                </div>

                <div class="summary-total">
                    <span>Total Pembayaran</span>
                    <span id="total_display">Rp 0</span>
                </div>

            </div>

            <button type="submit" class="btn-submit" id="btnSubmit">
                Proses Pesanan Sekarang
            </button>

        </div>

    </form>

</main>

<script>
'use strict';

// ==========================================
// KONFIGURASI CHECKOUT
// ==========================================

const CONFIG = {
    nomorWhatsApp: '6281545751255',
    halamanKatalog: '/pages/customer.html'
};

let hargaSatuan = 0;
let idProduk = null;
let isCheckoutKeranjang = false;
let dataKeranjang = [];
let sedangMemproses = false;

// ==========================================
// ELEMEN HTML
// ==========================================

const el = {
    form: document.getElementById('checkoutForm'),
    namaProduk: document.getElementById('nama_produk'),
    hargaDisplay: document.getElementById('harga_satuan_display'),
    jumlah: document.getElementById('jumlah'),
    detailUkuran: document.getElementById('detail_ukuran'),
    provinsi: document.getElementById('provinsi'),
    kabupaten: document.getElementById('kabupaten'),
    kecamatan: document.getElementById('kecamatan'),
    kelurahan: document.getElementById('kelurahan'),
    kodePos: document.getElementById('kode_pos'),
    kurir: document.getElementById('layanan_kurir'),
    metode: document.getElementById('metode_pembayaran'),
    detailAlamat: document.getElementById('detail_alamat'),
    subtotal: document.getElementById('subtotal_display'),
    ongkir: document.getElementById('ongkir_display'),
    total: document.getElementById('total_display'),
    containerKeranjang: document.getElementById('cart-items-summary-container'),
    tombol: document.getElementById('btnSubmit')
};

// ==========================================
// FUNGSI FORMAT RUPIAH
// ==========================================

function formatRupiah(value) {
    return 'Rp ' + Number(value || 0).toLocaleString('id-ID');
}

function angkaValid(value) {
    const number = Number(value);
    return Number.isFinite(number) ? number : 0;
}

// ==========================================
// REQUEST API
// ==========================================

async function requestJSON(url, options = {}) {

    const response = await fetch(url, {
        credentials: 'include',
        ...options,
        headers: {
            ...(options.headers || {})
        }
    });

    let result;

    try {
        result = await response.json();
    } catch (error) {
        throw new Error('Respons server tidak valid.');
    }

    if (!response.ok) {
        throw new Error(
            result.message || 'Terjadi kesalahan pada server.'
        );
    }

    return result;
}

// ==========================================
// INISIALISASI
// ==========================================

document.addEventListener('DOMContentLoaded', initCheckout);

async function initCheckout() {

    const params = new URLSearchParams(window.location.search);

    idProduk = params.get('id');
    isCheckoutKeranjang = params.get('mode') === 'keranjang';

    try {

        if (isCheckoutKeranjang) {
            await loadCartCheckout();
        } else {
            if (!idProduk) {
                throw new Error('Produk tidak ditemukan.');
            }

            await loadSingleProduct();
        }

        await loadProvinces();

    } catch (error) {
        console.error('Init checkout:', error);
        alert(error.message);
        window.location.href = CONFIG.halamanKatalog;
    }
}

// ==========================================
// LOAD PRODUK TUNGGAL
// ==========================================

async function loadSingleProduct() {

    const result = await requestJSON('/api/produk');

    if (result.status !== 'success') {
        throw new Error('Gagal mengambil data produk.');
    }

    const produk = result.data.find(
        item => String(item.id_produk) === String(idProduk)
    );

    if (!produk) {
        throw new Error('Produk tidak ditemukan di database.');
    }

    hargaSatuan = angkaValid(produk.harga_estimasi);

    el.namaProduk.value = produk.nama_produk;

    el.hargaDisplay.value = formatRupiah(hargaSatuan);

    kalkulasiBiaya();
}

// ==========================================
// LOAD CHECKOUT KERANJANG
// ==========================================

async function loadCartCheckout() {

    document.getElementById('sectionTitle').innerText =
        '🛒 Ringkasan Checkout Keranjang';

    document.getElementById('groupNamaProduk').style.display = 'none';
    document.getElementById('rowSatuanQty').style.display = 'none';
    document.getElementById('groupDetailCatatan').style.display = 'none';

    el.namaProduk.removeAttribute('required');
    el.jumlah.removeAttribute('required');
    el.detailUkuran.removeAttribute('required');

    const result = await requestJSON('/api/cart');

    if (
        result.status !== 'success' ||
        !Array.isArray(result.data) ||
        result.data.length === 0
    ) {
        throw new Error('Keranjang belanja Anda kosong.');
    }

    dataKeranjang = result.data;

    hargaSatuan = 0;
    el.containerKeranjang.innerHTML = '';

    dataKeranjang.forEach((item, index) => {

        const harga = angkaValid(item.harga_estimasi);
        const qty = Number(item.jumlah);

        if (!Number.isSafeInteger(qty) || qty < 1) {
            throw new Error('Jumlah produk dalam keranjang tidak valid.');
        }

        const subtotal = harga * qty;

        hargaSatuan += subtotal;

        const wrapper = document.createElement('div');
        wrapper.className = 'cart-item';

        const info = document.createElement('div');
        info.className = 'cart-item-info';

        const nama = document.createElement('strong');
        nama.textContent = `${index + 1}. ${item.nama_produk}`;

        const detail = document.createElement('small');
        detail.textContent =
            `Qty: ${qty} | Catatan: ${item.detail_ukuran || '-'}`;

        info.appendChild(nama);
        info.appendChild(detail);

        const hargaEl = document.createElement('div');
        hargaEl.className = 'cart-item-price';
        hargaEl.textContent = formatRupiah(subtotal);

        wrapper.appendChild(info);
        wrapper.appendChild(hargaEl);

        el.containerKeranjang.appendChild(wrapper);
    });

    kalkulasiBiaya();
}

// ==========================================
// LOAD PROVINSI
// ==========================================

async function loadProvinces() {

    const response = await fetch(
        'https://www.emsifa.com/api-wilayah-indonesia/api/provinces.json'
    );

    if (!response.ok) {
        throw new Error('Gagal memuat data provinsi.');
    }

    const data = await response.json();

    el.provinsi.innerHTML = '<option value="">Pilih Provinsi</option>';

    data.forEach(prov => {

        const option = document.createElement('option');

        option.value = prov.name;
        option.dataset.id = prov.id;
        option.textContent = prov.name;

        el.provinsi.appendChild(option);
    });
}

// ==========================================
// LOAD KABUPATEN
// ==========================================

el.provinsi.addEventListener('change', async function() {

    const provId = this.selectedOptions[0]?.dataset.id;

    el.kabupaten.innerHTML =
        '<option value="">Pilih Kabupaten/Kota</option>';

    el.kecamatan.innerHTML =
        '<option value="">Pilih Kabupaten Terlebih Dahulu</option>';

    el.kelurahan.innerHTML =
        '<option value="">Pilih Kecamatan Terlebih Dahulu</option>';

    resetKurir();

    kalkulasiBiaya();

    if (!provId) return;

    try {

        const response = await fetch(
            `https://www.emsifa.com/api-wilayah-indonesia/api/regencies/${provId}.json`
        );

        if (!response.ok) throw new Error('Gagal memuat kabupaten.');

        const data = await response.json();

        data.forEach(item => {

            const option = document.createElement('option');

            option.value = item.name;
            option.dataset.id = item.id;
            option.textContent = item.name;

            el.kabupaten.appendChild(option);
        });

    } catch (error) {
        console.error(error);
        alert('Gagal memuat kabupaten/kota.');
    }
});

// ==========================================
// LOAD KECAMATAN DAN ONGKIR
// ==========================================

el.kabupaten.addEventListener('change', async function() {

    const kabId = this.selectedOptions[0]?.dataset.id;
    const kabName = this.value;
    const provName = el.provinsi.value;

    el.kecamatan.innerHTML =
        '<option value="">Pilih Kecamatan</option>';

    el.kelurahan.innerHTML =
        '<option value="">Pilih Kecamatan Terlebih Dahulu</option>';

    el.kurir.innerHTML =
        '<option value="">Memuat tarif kurir...</option>';

    kalkulasiBiaya();

    if (!kabId) {
        resetKurir();
        return;
    }

    try {

        const [responseWilayah, responseOngkir] = await Promise.all([

            fetch(
                `https://www.emsifa.com/api-wilayah-indonesia/api/districts/${kabId}.json`
            ),

            requestJSON('/api/cek-ongkir', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    destinationName: kabName,
                    provinceName: provName,
                    weight: 1000
                })
            })

        ]);

        if (!responseWilayah.ok) {
            throw new Error('Gagal memuat kecamatan.');
        }

        const kecamatanData = await responseWilayah.json();

        kecamatanData.forEach(item => {

            const option = document.createElement('option');

            option.value = item.name;
            option.dataset.id = item.id;
            option.textContent = item.name;

            el.kecamatan.appendChild(option);
        });

        el.kurir.innerHTML =
            '<option value="">Pilih Layanan Kurir</option>';

        if (
            responseOngkir.status === 'success' &&
            Array.isArray(responseOngkir.data) &&
            responseOngkir.data.length > 0
        ) {

            responseOngkir.data.forEach(item => {

                const biaya = Number(item.cost);

                if (!Number.isSafeInteger(biaya) || biaya < 0) {
                    return;
                }

                const option = document.createElement('option');

                option.value = String(biaya);

                option.textContent =
                    `JNE ${item.service} (${item.etd}) - ${formatRupiah(biaya)}`;

                el.kurir.appendChild(option);
            });

            if (el.kurir.options.length === 1) {
                addPickupOption();
            }

        } else {
            addPickupOption();
        }

    } catch (error) {

        console.error('Ongkir:', error);

        el.kurir.innerHTML =
            '<option value="">Gagal memuat ongkir - Pilih ulang wilayah</option>';

        alert('Gagal mengambil tarif pengiriman. Silakan coba kembali.');
    }
});

function addPickupOption() {

    el.kurir.innerHTML = '';

    const option = document.createElement('option');

    option.value = '0';
    option.textContent = 'Ambil di Toko / Workshop (Gratis) - Rp 0';

    el.kurir.appendChild(option);
}

// ==========================================
// RESET KURIR
// ==========================================

function resetKurir() {

    el.kurir.innerHTML =
        '<option value="">Pilih Kabupaten/Kota Terlebih Dahulu</option>';
}

// ==========================================
// LOAD KELURAHAN
// ==========================================

el.kecamatan.addEventListener('change', async function() {

    const kecId = this.selectedOptions[0]?.dataset.id;

    el.kelurahan.innerHTML =
        '<option value="">Pilih Kelurahan/Desa</option>';

    if (!kecId) return;

    try {

        const response = await fetch(
            `https://www.emsifa.com/api-wilayah-indonesia/api/villages/${kecId}.json`
        );

        if (!response.ok) throw new Error('Gagal memuat kelurahan.');

        const data = await response.json();

        data.forEach(item => {

            const option = document.createElement('option');

            option.value = item.name;
            option.textContent = item.name;

            el.kelurahan.appendChild(option);
        });

    } catch (error) {
        console.error(error);
        alert('Gagal memuat kelurahan/desa.');
    }
});

// ==========================================
// HITUNG BIAYA
// ==========================================

function kalkulasiBiaya() {

    const jumlah = isCheckoutKeranjang
        ? 1
        : Math.max(1, Number(el.jumlah.value) || 1);

    const tarifKurir = el.kurir.value === ''
        ? 0
        : Number(el.kurir.value);

    const subtotal = hargaSatuan * jumlah;

    // Ongkir hanya satu kali untuk satu alamat pengiriman.
    // Tidak dikalikan jumlah produk atau jumlah baris keranjang.
    const ongkir = Number.isFinite(tarifKurir) && tarifKurir >= 0
        ? tarifKurir
        : 0;

    const total = subtotal + ongkir;

    el.subtotal.textContent = formatRupiah(subtotal);
    el.ongkir.textContent = formatRupiah(ongkir);
    el.total.textContent = formatRupiah(total);

    el.form.dataset.subtotal = String(subtotal);
    el.form.dataset.ongkir = String(ongkir);
    el.form.dataset.total = String(total);
}

// ==========================================
// EVENT HITUNG ULANG
// ==========================================

el.jumlah.addEventListener('input', kalkulasiBiaya);
el.kurir.addEventListener('change', kalkulasiBiaya);

// ==========================================
// ALAMAT PENGIRIMAN
// ==========================================

function buatAlamatLengkap() {

    const detail = el.detailAlamat.value.trim();
    const kelurahan = el.kelurahan.value;
    const kecamatan = el.kecamatan.value;
    const kabupaten = el.kabupaten.value;
    const provinsi = el.provinsi.value;
    const kodePos = el.kodePos.value.trim();

    return `${detail}, Kel. ${kelurahan}, Kec. ${kecamatan}, ${kabupaten}, Prov. ${provinsi} - Kode Pos: ${kodePos}`;
}

// ==========================================
// SUBMIT CHECKOUT
// ==========================================

el.form.addEventListener('submit', async function(event) {

    event.preventDefault();

    if (sedangMemproses) return;

    if (!el.form.reportValidity()) return;

    if (!el.kurir.value) {
        alert('Silakan pilih layanan kurir terlebih dahulu.');
        return;
    }

    const ongkir = Number(el.form.dataset.ongkir);
    const subtotal = Number(el.form.dataset.subtotal);
    const totalHarga = Number(el.form.dataset.total);

    if (
        !Number.isSafeInteger(ongkir) ||
        !Number.isSafeInteger(subtotal) ||
        !Number.isSafeInteger(totalHarga) ||
        ongkir < 0 ||
        totalHarga !== subtotal + ongkir
    ) {
        alert('Perhitungan biaya tidak valid. Silakan periksa kembali.');
        return;
    }

    const namaKurir =
        el.kurir.selectedOptions[0].textContent;

    const metodePembayaran =
        el.metode.value;

    const alamatLengkap =
        buatAlamatLengkap();

    const nomorWa =
        CONFIG.nomorWhatsApp;

    const tombolAwal =
        el.tombol.textContent;

    sedangMemproses = true;

    el.tombol.disabled = true;
    el.tombol.textContent = 'Memproses Pesanan...';

    try {

        let pesanWhatsApp = '';

        // ==================================
        // CHECKOUT KERANJANG
        // ==================================

        if (isCheckoutKeranjang) {

            // Kirim ongkir TOTAL satu kali.
            // Backend yang membagikannya ke masing-masing pesanan.

            const result = await requestJSON('/api/cart/checkout', {

                method: 'POST',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify({

                    alamat_pengiriman: alamatLengkap,

                    ongkir: ongkir,

                    metode_pembayaran: metodePembayaran

                })

            });

            if (result.status !== 'success') {
                throw new Error(
                    result.message || 'Checkout keranjang gagal.'
                );
            }

            const daftarProduk = dataKeranjang.map((item, index) => {

                const harga = angkaValid(item.harga_estimasi);
                const qty = Number(item.jumlah);
                const subtotalItem = harga * qty;

                return (
                    `\n${index + 1}. *${item.nama_produk}*\n` +
                    `   - Harga Satuan: ${formatRupiah(harga)}\n` +
                    `   - Jumlah: ${qty}\n` +
                    `   - Subtotal: ${formatRupiah(subtotalItem)}\n` +
                    `   - Catatan: ${item.detail_ukuran || '-'}\n`
                );

            }).join('');

            pesanWhatsApp =
                `*NOTA / KONFIRMASI CHECKOUT KERANJANG*\n` +
                `*PT Japa Prabu Advertising*\n\n` +
                `----------------------------------------\n` +
                `*DAFTAR PRODUK:*\n` +
                `${daftarProduk}\n` +
                `----------------------------------------\n` +
                `*INFORMASI PENGIRIMAN*\n` +
                `*Kurir / Layanan:* ${namaKurir}\n` +
                `*Alamat Lengkap:* ${alamatLengkap}\n` +
                `----------------------------------------\n` +
                `*RINCIAN PEMBAYARAN*\n` +
                `*Subtotal Produk:* ${formatRupiah(subtotal)}\n` +
                `*Ongkos Kirim:* ${formatRupiah(ongkir)}\n` +
                `*Total Pembayaran:* ${formatRupiah(totalHarga)}\n` +
                `*Metode Pembayaran:* ${metodePembayaran}\n\n` +
                `Mohon konfirmasi dan proses pesanan ini. Terima kasih!`;

        }

        // ==================================
        // CHECKOUT PRODUK TUNGGAL
        // ==================================

        else {

            const jumlah = Number(el.jumlah.value);
            const detailUkuran = el.detailUkuran.value.trim();

            const payload = {

                id_produk: Number(idProduk),

                jumlah: jumlah,

                detail_ukuran: detailUkuran,

                alamat_pengiriman: alamatLengkap,

                ongkir: ongkir,

                total_harga: totalHarga,

                metode_pembayaran: metodePembayaran

            };

            const result = await requestJSON('/api/pesanan', {

                method: 'POST',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify(payload)

            });

            if (result.status !== 'success') {
                throw new Error(
                    result.message || 'Gagal membuat pesanan.'
                );
            }

            const subtotalProduk = hargaSatuan * jumlah;

            pesanWhatsApp =
                `*NOTA / KONFIRMASI PESANAN BARU*\n` +
                `*PT Japa Prabu Advertising*\n\n` +
                `----------------------------------------\n` +
                `*ID Pesanan:* ${result.id_pesanan || '-'}\n` +
                `*Nama Produk:* ${el.namaProduk.value}\n` +
                `*Harga Satuan:* ${formatRupiah(hargaSatuan)}\n` +
                `*Jumlah (Qty):* ${jumlah}\n` +
                `*Subtotal Produk:* ${formatRupiah(subtotalProduk)}\n` +
                `*Detail Ukuran:* ${detailUkuran}\n` +
                `----------------------------------------\n` +
                `*INFORMASI PENGIRIMAN*\n` +
                `*Kurir / Layanan:* ${namaKurir}\n` +
                `*Alamat Lengkap:* ${alamatLengkap}\n` +
                `----------------------------------------\n` +
                `*RINCIAN PEMBAYARAN*\n` +
                `*Subtotal:* ${formatRupiah(subtotalProduk)}\n` +
                `*Ongkos Kirim:* ${formatRupiah(ongkir)}\n` +
                `*Total Pembayaran:* ${formatRupiah(totalHarga)}\n` +
                `*Metode Pembayaran:* ${metodePembayaran}\n\n` +
                `Mohon konfirmasi dan proses pesanan ini. Terima kasih!`;

        }

        // ==================================
        // LANJUTKAN KE WHATSAPP
        // ==================================

        alert(
            'Pesanan berhasil disimpan ke sistem! Klik OK untuk melanjutkan ke WhatsApp.'
        );

        const waUrl =
            `https://wa.me/${nomorWa}?text=${encodeURIComponent(pesanWhatsApp)}`;

        window.location.href = waUrl;

    } catch (error) {

        console.error('Checkout error:', error);

        alert(error.message || 'Terjadi kesalahan saat checkout.');

        sedangMemproses = false;

        el.tombol.disabled = false;
        el.tombol.textContent = tombolAwal;

    }

});
</script>

</body>
</html>
