<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Pesanan - PT Japa Prabu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #f8fafc;
            color: #1e293b;
        }

        navbar {
            display: block;
            background: #fff;
            border-bottom: 1px solid #e2e8f0;
            padding: 16px 24px;
            box-shadow: 0 1px 3px rgba(0,0,0,.05);
        }

        .nav-container {
            max-width: 1200px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 1px 3px rgba(0,0,0,.05);
            border: 1px solid #e2e8f0;
            margin-bottom: 20px;
        }

        h2 {
            margin-bottom: 20px;
            color: #0f172a;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 10px;
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            background: #fff;
        }

        input:read-only {
            background: #f1f5f9;
            cursor: not-allowed;
        }

        .summary-box {
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            border: 1px solid #e2e8f0;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px dashed #cbd5e1;
            font-weight: 700;
            font-size: 18px;
            color: #2563eb;
        }

        .btn-submit {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin-top: 20px;
        }

        .btn-submit:hover {
            background: #1d4ed8;
        }

        .btn-submit:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .btn-back {
            background: #e2e8f0;
            color: #475569;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 20px;
            display: inline-block;
            text-decoration: none;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid #f1f5f9;
            font-size: 14px;
        }

        .cart-item-info {
            min-width: 0;
        }

        .cart-item-info strong {
            color: #0f172a;
        }

        .cart-item-info small {
            display: block;
            margin-top: 5px;
            color: #64748b;
            line-height: 1.5;
        }

        .cart-item-price {
            color: #2563eb;
            font-weight: 600;
            white-space: nowrap;
        }

        @media(max-width: 600px) {
            main {
                margin: 20px auto;
                padding: 0 12px;
            }

            .card {
                padding: 18px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .summary-total {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

<navbar>
    <div class="nav-container">
        <a href="/pages/customer.html" class="brand">
            <img src="/images/logo.png" alt="Logo" width="30">
            Checkout Japa Prabu
        </a>
    </div>
</navbar>

<main>

    <a href="/pages/customer.html" class="btn-back">
        ← Kembali ke Katalog
    </a>

    <form id="checkoutForm">

        <!-- RINCIAN PRODUK -->
        <div class="card" id="cardRincianProduk">

            <h2 id="sectionTitle">Rincian Produk</h2>

            <div id="cart-items-summary-container"
                 style="margin-bottom:16px;"></div>

            <div class="form-group" id="groupNamaProduk">
                <label>Nama Produk</label>
                <input type="text" id="nama_produk" readonly>
            </div>

            <div class="form-row" id="rowSatuanQty">

                <div class="form-group">
                    <label>Harga Satuan / Estimasi</label>
                    <input type="text" id="harga_satuan_display" readonly>
                </div>

                <div class="form-group">
                    <label>Jumlah Pesanan (Qty)</label>
                    <input type="number" id="jumlah"
                           min="1" value="1" required>
                </div>

            </div>

            <div class="form-group" id="groupDetailCatatan">
                <label>Detail Ukuran & Catatan Desain</label>
                <textarea id="detail_ukuran" rows="2"
                    placeholder="Contoh: Ukuran 3x1 Meter, finishing mata ayam..."
                    required></textarea>
            </div>

        </div>

        <!-- ALAMAT DAN PEMBAYARAN -->
        <div class="card">

            <h2>Alamat Pengiriman & Pembayaran</h2>

            <div class="form-row">

                <div class="form-group">
                    <label>Provinsi</label>
                    <select id="provinsi" required>
                        <option value="">Pilih Provinsi</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Kabupaten / Kota</label>
                    <select id="kabupaten" required>
                        <option value="">Pilih Provinsi Terlebih Dahulu</option>
                    </select>
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label>Kecamatan</label>
                    <select id="kecamatan" required>
                        <option value="">Pilih Kabupaten Terlebih Dahulu</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Kelurahan / Desa</label>
                    <select id="kelurahan" required>
                        <option value="">Pilih Kecamatan Terlebih Dahulu</option>
                    </select>
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label>Kode Pos</label>
                    <input type="text" id="kode_pos"
                           placeholder="Contoh: 78611" required>
                </div>

                <div class="form-group">
                    <label>Pilih Kurir / Layanan Pengiriman</label>
                    <select id="layanan_kurir" required>
                        <option value="">Pilih Kabupaten/Kota Terlebih Dahulu</option>
                    </select>
                </div>

            </div>

            <div class="form-group">
                <label>Detail Alamat</label>
                <textarea id="detail_alamat" rows="2"
                    placeholder="Nama jalan, nomor rumah, RT/RW, patokan..."
                    required></textarea>
            </div>

            <div class="form-group">
                <label>Metode Pembayaran</label>

                <select id="metode_pembayaran" required>
                    <option value="Transfer Bank BCA">
                        Transfer Bank BCA
                    </option>

                    <option value="Transfer Bank Mandiri">
                        Transfer Bank Mandiri
                    </option>

                    <option value="Transfer Bank BNI">
                        Transfer Bank BNI
                    </option>

                    <option value="E-Wallet (GoPay / OVO / Dana)">
                        E-Wallet (GoPay / OVO / Dana)
                    </option>

                    <option value="Bayar di Toko (Tunai)">
                        Bayar di Toko (Tunai)
                    </option>
                </select>
            </div>

        </div>

        <!-- RINGKASAN BIAYA -->
        <div class="card">

            <h2>Ringkasan Biaya</h2>

            <div class="summary-box">

                <div class="summary-row">
                    <span>Subtotal Produk</span>
                    <span id="subtotal_display">Rp 0</span>
                </div>

                <div class="summary-row">
                    <span>Ongkos Kirim</span>
                    <span id="ongkir_display">Rp 0</span>
                </div>

                <div class="summary-total">
                    <span>Total Pembayaran</span>
                    <span id="total_display">Rp 0</span>
                </div>

            </div>

            <button type="submit" class="btn-submit" id="btnSubmit">
                Proses Pesanan Sekarang
            </button>

        </div>

    </form>

</main>

<script src="/js/csrf.js" defer></script>
<script src="/js/checkout.js"></script>

</body>
</html>
